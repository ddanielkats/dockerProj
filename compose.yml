services:
  app:
    build: .
    ports:
      - '8501:8501'
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: pg-container
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myDB
      
    volumes:
      - ~/data_test:/var/lib/postgresql/data
    ports:
      - '5432:5432'